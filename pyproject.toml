[project]
requires-python = ">=3.14"
license = "GPL-3.0-only"

[build-system]
requires = [
    # Needed for installing Python packages
    "installer == 0.7.0",
    # Needed for for glib
    "packaging == 23.1",
]

[tool.ty.src]
include = [
  "kitty",
  "kittens",
  "glfw",
  "*.py",
  "docs/conf.py",
  "gen"
]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ['E', 'F', 'I', 'RUF100']
# Select the flake8-annotations ruleset for marking untyped function
extend-select = ["ANN"]
ignore = ["ANN401"]  # allow typing.Any

[tool.ruff.lint.flake8-annotations]
# Allow omitting '-> None' on __init__ if arguments are typed
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
"kitty/options/types.py" = ["E501"]
"kitty/options/parse.py" = ["E501"]
"shell-integration/ssh/bootstrap.py" = ["ANN"]
"kitty_tests/*.py" = ["ANN"]
"bypy/*" = ["ANN"]
"3rdparty/*" = ["ANN"]

[tool.ruff.lint.isort]
detect-same-package = true

[tool.ruff.format]
quote-style = 'single'
exclude = ['kitty/options/types.py', 'kitty/options/parse.py']
